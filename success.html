
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Support Request Submitted | Conversive</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f5f7fc;
      color: #1d2740;
      font-family: Arial, Helvetica, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 480px;
      background: white;
      border-radius: 18px;
      padding: 44px 32px;
      text-align: center;
      box-shadow: 0 14px 44px rgba(33, 51, 87, 0.10);
    }

    .icon {
      display: grid;
      place-items: center;
      margin: 0 auto 20px;
      width: 66px;
      height: 66px;
      border-radius: 50%;
      background: #e9f8ee;
      color: #18864a;
      font-size: 34px;
      font-weight: bold;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 25px;
    }

    p {
      color: #52607a;
      line-height: 1.6;
      margin: 0 0 24px;
    }

    a {
      display: inline-block;
      color: white;
      background: #2563eb;
      border-radius: 10px;
      padding: 13px 22px;
      text-decoration: none;
      font-weight: 600;
    }

    a:hover {
      background: #1d4ed8;
    }

    small {
      display: block;
      margin-top: 23px;
      color: #78849b;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="icon" aria-hidden="true">✓</div>

    <h1>Support Request Submitted</h1>

    <p>
      Thank you for contacting us.
      Your request has been submitted for processing.
      Our support team will review it.
    </p>

    <a href="/">Back to Support Form</a>
  </main>
</body>
</html>

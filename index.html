
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raise a Support Ticket | Conversive</title>

  <style>
    :root {
      --blue: #155cf5;
      --orange: #ff7820;
      --ink: #17213d;
      --muted: #515e7b;
      --line: #c8d1e2;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 10px 20px 20px;
      overflow-x: hidden;
      background:
        radial-gradient(ellipse 62% 48% at 54% 12%,
          #fff 0%, #f7f9ff 57%, transparent 100%),
        linear-gradient(135deg,
          #e5edff 0%, #fff 45%, #fff3ec 100%);
      color: var(--ink);
      font-family: Inter, "Segoe UI", Arial, sans-serif;
    }

    .decoration {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .wave-blue {
      position: absolute;
      width: 83vw;
      height: 70vh;
      left: -40vw;
      top: 8vh;
      border-radius: 48% 56% 53% 47%;
      transform: rotate(19deg);
      background: linear-gradient(130deg,
        #6195ff 12%, #cde0ff 73%, #edf3ff 100%);
      box-shadow: 0 36px 0 7px rgba(87,147,255,.20);
    }

    .wave-blue-bottom {
      position: absolute;
      left: -28vw;
      bottom: -43vh;
      height: 79vh;
      width: 94vw;
      border-radius: 54% 60% 0 0;
      transform: rotate(18deg);
      background: linear-gradient(20deg,
        #b4ceff 0%, #e9f0ff 58%,
        rgba(255,255,255,.5) 100%);
    }

    .wave-orange {
      position: absolute;
      width: 65vw;
      height: 55vh;
      top: -35vh;
      right: -13vw;
      border-radius: 0 0 52% 55%;
      transform: rotate(-21deg);
      background: linear-gradient(110deg,
        #ffbb7c, #ff8b29 70%, #ff7318);
      box-shadow:
        -5px 34px 0 #fff,
        -9px 75px 0 #7eaaff;
    }

    .wave-orange-bottom {
      position: absolute;
      width: 75vw;
      height: 65vh;
      right: -32vw;
      bottom: -43vh;
      border-radius: 55% 48% 0 0;
      transform: rotate(-24deg);
      background: linear-gradient(90deg,
        #ffe8d9 5%, #ffad70 58%, #ff8526 100%);
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 1090px;
      margin: 0 auto;
    }

    .page-header {
      text-align: center;
      margin: 0 auto 15px;
    }

    .logo {
      display: block;
      width: min(380px, 75vw);
      max-height: 85px;
      object-fit: contain;
      margin: 0 auto 5px;
    }

    .headline {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 30px;
    }

    .headline::before,
    .headline::after {
      content: "";
      display: block;
      width: 66px;
      height: 2px;
      background: var(--orange);
    }

    h1 {
      font-size: clamp(24px, 3vw, 32px);
      margin: 0 0 5px;
      letter-spacing: -.045em;
      font-weight: 800;
    }

    .page-header p {
      margin: 0;
      font-size: clamp(15px, 1.8vw, 18px);
      color: var(--muted);
      line-height: 1.5;
    }

    .card {
      background: rgba(255,255,255,.94);
      border: 1px solid rgba(255,255,255,.97);
      border-radius: 22px;
      padding: 20px 35px 25px;
      box-shadow: 0 20px 44px rgba(22,66,144,.18);
      backdrop-filter: blur(14px);
    }

    .card-heading {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 25px;
    }

    .headphone {
      width: 65px;
      height: 65px;
      border-radius: 15px;
      display: grid;
      place-items: center;
      color: #ff7018;
      background: #ffe9dc;
      box-shadow: 0 5px 12px rgba(249,111,35,.18);
    }

    h2 {
      margin: 0;
      font-size: clamp(23px, 2.8vw, 30px);
      letter-spacing: -.035em;
    }

    .field {
      display: grid;
      grid-template-columns: 200px 1fr;
      align-items: start;
      gap: 12px;
      margin-bottom: 10px;
    }

    .field-label {
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 40px;
      font-size: 15px;
      font-weight: 700;
    }

    .field-label svg {
      width: 25px;
      height: 25px;
      flex: 0 0 25px;
      stroke: #0c65ff;
      stroke-width: 2;
      fill: none;
    }

    .required {
      color: #e65333;
      margin-left: 2px;
    }

    .control {
      width: 100%;
      border: 1.5px solid var(--line);
      border-radius: 8px;
      background: #fff;
      padding: 9px 14px;
      min-height: 40px;
      font: inherit;
      font-size: 14px;
      color: var(--ink);
      box-shadow: 0 2px 4px rgba(39,65,109,.08);
      transition: border-color .15s, box-shadow .15s;
    }

    .control::placeholder {
      color: #69758e;
      opacity: 1;
    }

    .control:focus {
      outline: none;
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(21,92,245,.12);
    }

    textarea.control {
      resize: vertical;
      min-height: 98px;
    }

    .upload-zone {
      min-height: 138px;
      border: 2px dashed #8bb2ff;
      border-radius: 14px;
      background: #f0f5ff;
      cursor: pointer;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 18px;
      transition: background .15s, border-color .15s;
    }

    .upload-zone:hover,
    .upload-zone.dragging {
      background: #e4eeff;
      border-color: var(--blue);
    }

    .upload-zone:focus-visible {
      outline: 3px solid var(--blue);
      outline-offset: 2px;
    }

    .upload-zone > svg {
      width: 49px;
      height: 49px;
      stroke: #0867ee;
      fill: none;
      stroke-width: 1.8;
    }

    .upload-zone strong {
      display: block;
      margin: 6px 0;
      font-size: 17px;
    }

    .upload-zone .browse {
      color: #075ce3;
      text-decoration: underline;
    }

    .upload-zone small {
      color: #45526d;
      font-size: 13px;
      line-height: 1.5;
    }

    #picker { display: none; }

    .attachments {
      display: grid;
      gap: 7px;
      margin-top: 10px;
    }

    .attachment-item {
      background: #f5f8ff;
      border: 1px solid #dbe6ff;
      padding: 9px 12px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-width: 0;
      font-size: 14px;
    }

    .file-name { overflow-wrap: anywhere; }

    .attachment-item button {
      border: 0;
      background: transparent;
      color: #b13b32;
      font-weight: 700;
      cursor: pointer;
      padding: 4px 7px;
    }

    .actions {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      padding-top: 12px;
      flex-wrap: wrap;
    }

    .btn {
      border-radius: 999px;
      padding: 10px 30px;
      min-width: 165px;
      font: inherit;
      font-size: 15px;
      font-weight: 700;
      display: inline-flex;
      gap: 10px;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .btn svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
    }

    .btn-primary {
      border: 1px solid #1a60ed;
      background: linear-gradient(180deg, #3d81ff, #0451ea);
      color: white;
      box-shadow: 0 5px 12px rgba(12,82,228,.20);
    }

    .btn-primary:hover {
      background: linear-gradient(180deg, #2168f0, #064ad5);
    }

    .btn-primary:disabled {
      opacity: .65;
      cursor: not-allowed;
    }

    .btn-secondary {
      border: 1.5px solid #7c859c;
      color: #252e48;
      background: #fff;
    }

    .btn-secondary:hover { background: #f3f6fc; }

    .footer {
      text-align: center;
      color: #69758b;
      font-size: 12px;
      padding-top: 22px;
    }

    .footer a { color: inherit; }

    #file-error {
      color: #b42318;
      font-size: 13px;
      margin: 7px 0 0;
    }

    @media (max-width: 760px) {
      body { padding: 16px 12px 32px; }
      .logo { width: min(360px, 87vw); }
      .headline { gap: 12px; }
      .headline::before,
      .headline::after { width: 24px; }
      .page-header { margin-bottom: 22px; }
      .card { padding: 23px 18px 30px; border-radius: 20px; }
      .card-heading { margin-bottom: 24px; }
      .headphone { width: 54px; height: 54px; }

      .field {
        display: block;
        margin-bottom: 17px;
      }

      .field-label {
        gap: 10px;
        min-height: auto;
        margin-bottom: 9px;
        font-size: 15px;
      }

      .field-label svg {
        width: 19px;
        height: 19px;
        flex-basis: 19px;
      }

      .actions { gap: 12px; }
      .btn { width: 100%; min-width: auto; }
    }
  </style>
</head>

<body>
  <div class="decoration" aria-hidden="true">
    <div class="wave-blue"></div>
    <div class="wave-blue-bottom"></div>
    <div class="wave-orange"></div>
    <div class="wave-orange-bottom"></div>
  </div>

  <main class="container">

    <header class="page-header">
      <img
        class="logo"
        src="assests/conversive-logo.png"
        alt="Conversive, formerly SMS Magic"
      >

      <div class="headline">
        <h1>Raise a Support Ticket</h1>
      </div>

      <p>
        Get help from our support team. Share your details,
        and we'll get back to you soon.
      </p>
    </header>

    <section class="card" aria-labelledby="form-title">

      <div class="card-heading">
        <div class="headphone" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="39" height="39"
               fill="none" stroke="currentColor"
               stroke-width="2.5" stroke-linecap="round">
            <path d="M5 18v-3a11 11 0 0 1 22 0v3"/>
            <rect x="3" y="16" width="6" height="10" rx="2"/>
            <rect x="23" y="16" width="6" height="10" rx="2"/>
            <path d="M26 26c0 3-3 4-8 4h-3"/>
          </svg>
        </div>

        <h2 id="form-title">Support Ticket</h2>
      </div>

      <!-- Zoho Desk EU Test Organization -->
      <form
        id="zsWebToCase_260849000000960001"
        name="zsWebToCase_260849000000960001"
        action="https://desk.zoho.eu/support/WebToCase"
        method="POST"
        enctype="multipart/form-data"
      >

        <!-- Zoho generated hidden parameters -->
        <input type="hidden" name="xnQsjsdp"
          value="edbsne52a0012f2f0dda6d09258a40c9d6d91">

        <input type="hidden" name="xmIwtLD"
          value="edbsn5d04107ff0a5b55c330b34974bd988e71cfff5f9ec0840924ab8eb66a0a08d21">

        <input type="hidden" name="xJdfEaS" value="">
        <input type="hidden" name="actionType" value="Q2FzZXM=">

        <input
          type="hidden"
          name="returnURL"
          value="https://zohodeskform.vercel.app/success.html"
        >

        <!-- Name -->
        <div class="field">
          <label class="field-label" for="customer-name">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="7" r="4"/>
              <path d="M4 21v-2a8 8 0 0 1 16 0v2H4z"/>
            </svg>
            <span>Name<span class="required">*</span></span>
          </label>

          <input
            class="control"
            id="customer-name"
            name="Contact Name"
            type="text"
            maxlength="120"
            placeholder="Enter your name"
            autocomplete="name"
            required
          >
        </div>

        <!-- Email -->
        <div class="field">
          <label class="field-label" for="email">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="2" y="4" width="20" height="16" rx="2"/>
              <path d="m3 6 9 7 9-7"/>
            </svg>
            <span>Email<span class="required">*</span></span>
          </label>

          <input
            class="control"
            id="email"
            name="Email"
            type="email"
            maxlength="120"
            placeholder="Enter your email address"
            autocomplete="email"
            required
          >
        </div>

        <!-- Subject -->
        <div class="field">
          <label class="field-label" for="subject">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 12 12 20 3 11V4h7z"/>
              <circle cx="7.5" cy="8" r="1"/>
            </svg>
            <span>Subject<span class="required">*</span></span>
          </label>

          <input
            class="control"
            id="subject"
            name="Subject"
            type="text"
            maxlength="255"
            placeholder="Enter the ticket subject"
            required
          >
        </div>

        <!-- Description -->
        <div class="field">
          <label class="field-label" for="description">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="4" y="2" width="16" height="20" rx="2"/>
              <path d="M8 7h8M8 11h8M8 15h6"/>
            </svg>
            <span>Description</span>
          </label>

          <textarea
            class="control"
            id="description"
            name="Description"
            maxlength="3000"
            placeholder="Describe your issue or request in detail..."
          ></textarea>
        </div>

        <!-- Attachments -->
        <div class="field">
          <div class="field-label" id="attachment-label">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m8 12 7-7a4 4 0 0 1 6 6l-10 10a6 6 0 0 1-9-9L12 2"/>
            </svg>
            <span>Attachment</span>
          </div>

          <div>
            <div
              class="upload-zone"
              id="drop-zone"
              tabindex="0"
              role="button"
              aria-labelledby="attachment-label"
              aria-describedby="upload-help"
            >
              <svg viewBox="0 0 52 52" aria-hidden="true">
                <path d="M14 37h-3a9 9 0 0 1 0-18 15 15 0 0 1 29 2 9 9 0 0 1 1 18h-3"/>
                <path d="M26 43V22m-9 9 9-9 9 9"/>
              </svg>

              <div>
                <strong>
                  Drag &amp; drop files here, or
                  <span class="browse">browse files</span>
                </strong>
                <small id="upload-help">
                  Up to 5 files, 20 MB each.
                </small>
              </div>
            </div>

            <input
              id="picker"
              type="file"
              multiple
              tabindex="-1"
              aria-label="Choose attachments"
            >

            <!-- Zoho attachment fields -->
            <input type="file" name="attachment_1" class="zoho-file" hidden>
            <input type="file" name="attachment_2" class="zoho-file" hidden>
            <input type="file" name="attachment_3" class="zoho-file" hidden>
            <input type="file" name="attachment_4" class="zoho-file" hidden>
            <input type="file" name="attachment_5" class="zoho-file" hidden>

            <div id="file-error" role="alert"></div>
            <div class="attachments" id="attachments" aria-live="polite"></div>
          </div>
        </div>

        <!-- Buttons -->
        <div class="actions">
          <button
            class="btn btn-primary"
            type="submit"
            id="submit-btn"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m22 2-7 20-4-9-9-4zM11 13 22 2"/>
            </svg>
            Submit
          </button>

          <button class="btn btn-secondary" type="reset">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 11a9 9 0 1 1 2.5 6.2M3 3v8h8"/>
            </svg>
            Reset
          </button>
        </div>

      </form>

      <div class="footer">
        Powered by
        <a href="https://conversive.ai/"
           target="_blank" rel="noopener noreferrer">
          Conversive
        </a>
      </div>
    </section>
  </main>

  <script>
    const form = document.getElementById(
      'zsWebToCase_260849000000960001'
    );
    const picker = document.getElementById('picker');
    const zone = document.getElementById('drop-zone');
    const filesContainer = document.getElementById('attachments');
    const fileInputs = [...document.querySelectorAll('.zoho-file')];
    const error = document.getElementById('file-error');
    const submitBtn = document.getElementById('submit-btn');

    const files = [];

    const blocked = new Set([
      'ade','adp','apk','appx','appxbundle','bat',
      'cab','cer','chm','cmd','com','cpl','dll',
      'dmg','exe','hta','iso','jar','js','jse',
      'lnk','msi','msp','ps1','reg','scr',
      'vbs','wsc','wsf','wsh'
    ]);

    function syncFiles() {
      fileInputs.forEach((input, i) => {
        const transfer = new DataTransfer();
        if (files[i]) transfer.items.add(files[i]);
        input.files = transfer.files;
      });

      filesContainer.replaceChildren();

      files.forEach((file, index) => {
        const item = document.createElement('div');
        item.className = 'attachment-item';

        const name = document.createElement('span');
        name.className = 'file-name';
        name.textContent = file.name;

        const remove = document.createElement('button');
        remove.type = 'button';
        remove.textContent = 'Remove';
        remove.setAttribute('aria-label', 'Remove ' + file.name);

        remove.addEventListener('click', () => {
          files.splice(index, 1);
          syncFiles();
        });

        item.append(name, remove);
        filesContainer.append(item);
      });
    }

    function addFiles(incoming) {
      error.textContent = '';

      for (const file of incoming) {
        if (files.length >= 5) {
          error.textContent = 'You can attach up to 5 files.';
          break;
        }

        if (file.size > 20 * 1024 * 1024) {
          error.textContent = 'Each file must be 20 MB or smaller.';
          continue;
        }

        const ext = file.name.split('.').pop().toLowerCase();

        if (blocked.has(ext)) {
          error.textContent = 'One or more file types are not supported.';
          continue;
        }

        if (files.some(f =>
          f.name === file.name &&
          f.size === file.size &&
          f.lastModified === file.lastModified
        )) continue;

        files.push(file);
      }

      syncFiles();
    }

    zone.addEventListener('click', () => picker.click());

    zone.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        picker.click();
      }
    });

    picker.addEventListener('change', () => {
      addFiles(picker.files);
      picker.value = '';
    });

    ['dragenter', 'dragover'].forEach(name => {
      zone.addEventListener(name, e => {
        e.preventDefault();
        zone.classList.add('dragging');
      });
    });

    ['dragleave', 'drop'].forEach(name => {
      zone.addEventListener(name, e => {
        e.preventDefault();
        zone.classList.remove('dragging');
      });
    });

    zone.addEventListener('drop', e => {
      addFiles(e.dataTransfer.files);
    });

    form.addEventListener('reset', () => {
      setTimeout(() => {
        files.length = 0;
        error.textContent = '';
        syncFiles();
      }, 0);
    });

    form.addEventListener('submit', e => {
      if (!form.reportValidity()) {
        e.preventDefault();
        return;
      }

      // Normal POST to Zoho Desk
      submitBtn.disabled = true;
      submitBtn.textContent = 'Submitting...';
    });

    window.addEventListener('pageshow', () => {
      submitBtn.disabled = false;
      submitBtn.innerHTML =
        '<svg viewBox="0 0 24 24" aria-hidden="true">' +
        '<path d="m22 2-7 20-4-9-9-4zM11 13 22 2"/>' +
        '</svg>Submit';
    });
  </script>
</body>
</html>
